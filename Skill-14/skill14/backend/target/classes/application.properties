# ── Server ──
server.port=8080

# ── MySQL DataSource ──
# Update the database name, username, and password as per your MySQL setup
spring.datasource.url=jdbc:mysql://localhost:3306/skill14_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ── CORS is handled by CorsConfig.java ──
