# ============================================================
# FSAD Skill-13 – Nginx Configuration
# File: /etc/nginx/sites-available/fsad-app
#
# TASK 5: Deploy React build + reverse-proxy to Spring Boot
#
# Steps:
#   sudo cp this file /etc/nginx/sites-available/fsad-app
#   sudo ln -s /etc/nginx/sites-available/fsad-app /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name your-domain.com;   # Replace with your IP or domain

    # Serve React production build (TASK 5)
    root /var/www/fsad-app;        # Copy React build/ here
    index index.html;

    # SPA fallback: send all unknown paths to React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/* → Spring Boot JAR on port 8080 (TASK 4 & 5)
    location /api/ {
        proxy_pass         http://localhost:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Expose Spring Boot Actuator only locally
    location /actuator/ {
        proxy_pass http://localhost:8080/actuator/;
        allow 127.0.0.1;
        deny all;
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # Gzip compression for faster frontend delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
