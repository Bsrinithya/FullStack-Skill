# ============================================================
# FSAD Skill-13 – Spring Boot Application Properties
# ============================================================

# Server port (TASK 4: run JAR and hit http://localhost:8080)
server.port=8080

# Application name
spring.application.name=student-app

# ── H2 In-Memory Database (zero setup for lab) ──────────────
spring.datasource.url=jdbc:h2:mem:fsaddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 console → http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Actuator (TASK 4: verify via /actuator/health) ──────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Sample data loaded at startup ───────────────────────────
spring.sql.init.mode=always

